<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Liga | Meine Projekte</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- defer erhält die Reihenfolge: erst Ligadaten, dann Verarbeitung nach dem Einlesen des HTML. -->
  <script src="js/liga-daten.js" defer></script>
  <script src="js/pokemon.js" defer></script>
</head>
<body class="pokemon-page">
  <main class="container">
    <a class="back-link" href="index.html">Zur Startseite</a>
    <header class="page-header">
      <p class="eyebrow">Meine Projekte</p>
      <h1>Pokémon Liga</h1>
    </header>

    <!-- Saisonname und Turnierzahl kommen aus der zentralen JavaScript-Konfiguration. -->
    <h2 id="saison-name"></h2>
    <p id="saison-fortschritt"></p>

    <!-- Auf kleinen Bildschirmen lässt sich nur die Tabelle seitlich scrollen. -->
    <div class="table-wrapper" role="region" aria-label="Ligatabelle" tabindex="0">
      <table>
        <caption>Ligatabelle</caption>
        <thead>
          <tr>
            <th scope="col">Platz</th>
            <th scope="col">Spieler</th>
            <th scope="col">Teilnahmen</th>
            <th scope="col">1. Platz</th>
            <th scope="col">2. Platz</th>
            <th scope="col">3. Platz</th>
            <th scope="col">4. Platz</th>
            <th scope="col">Punkte</th>
          </tr>
        </thead>
        <tbody>
          <!-- Hier können später Spieler als weitere Tabellenzeilen stehen. -->
          <tr>
            <td class="empty-state" colspan="8">Noch keine Spieler eingetragen.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
